services:

  postgres-test:
    image: postgres:16

    container_name: inventory-database-test
    env_file:
      - .env.test

    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: ffidb_test
      TZ: Asia/Riyadh


    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U test_user -d ffidb_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-test:
    build: ./backend
    env_file:
      - .env.test

    depends_on:
      postgres-test:
        condition: service_healthy

    command: >
      sh -c "
        alembic upgrade head &&
        python -m app.scripts.seeding.seed_all &&
        pytest tests -v
      "