services:

  database:
    image: postgres:16
    container_name: IT-Inventory-Database
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Riyadh

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    expose:
      - "5432"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: IT-Inventory-Migrate

    env_file:
      - .env

    depends_on:
      database:
        condition: service_healthy

    command: >
      sh -c "
        alembic upgrade head &&
        python -m app.scripts.seed_all
      "

    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: IT-Inventory-Backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    expose:
      - "8000"

    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    container_name: IT-Inventory-Frontend

    restart: unless-stopped

    expose:
      - "3000"

  nginx:
    image: nginx:latest

    container_name: IT-Inventory-Nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend

volumes:
  pgdata: